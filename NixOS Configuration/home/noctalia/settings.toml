config_version = 12

[bar.default]
auto_hide = true
background_opacity = 0.6
center = ["workspaces"]
end = ["tray", "cpu", "ram", "battery", "notifications"]
margin_edge = 12
margin_ends = 300
panel_overlap = 0
position = "bottom"
reserve_space = false
show_on_workspace_switch = false
start = ["control-center", "clock", "active_window", "media"]
widget_spacing = 10

[battery]
warning_threshold = 20

[dock]
background_opacity = 0.6

[hot_corners]
enabled = true

[hot_corners.top_left]
action = "window_switcher"

[location]
address = "nanjing"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = ["lockscreen-login-box@eDP-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 196.0
box_width = 810.0
cx = 960.0
cy = 898.0
output = "eDP-1"
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[notification]
background_opacity = 0.6

[osd]
background_opacity = 0.6

[osd.kinds]
lock_keys = false

[shell]
avatar_path = "/home/hesprs/Pictures/Avatar.jpg"
launch_apps_as_systemd_services = true
password_style = "random"
settings_window_translucent = true

[shell.panel]
transparency_mode = "glass"

[shell.screen_corners]
enabled = true
size = 50

[theme.templates]
enable_builtin_templates = false
enable_community_templates = false

[widget.cpu]
visualization = "none"

[widget.media]
hide_when_no_media = true

[widget.ram]
stat = "ram_pct"
visualization = "none"

[widget.tray]
drawer = true
